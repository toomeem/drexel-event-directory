name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_LAMBDA_ENDPOINT: 'https://py256leklagmag7zxvhltladtu0aflsd.lambda-url.us-east-1.on.aws/'
          VITE_CHATBOT_LAMBDA_ENDPOINT: 'https://bp7tncg4c4pbgfy4rpgpm5nhky0tazbg.lambda-url.us-east-1.on.aws/'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
